name: Telegram Message Listener

on:
  workflow_dispatch:
  schedule:
    # BIST açık saatlerinde her 10 dakikada bir (UTC bazlı)
    # UTC 7-15 = Türkiye 10-18
    - cron: '*/10 7-15 * * 1-5'

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-listener-${{ hashFiles('**/requirements.txt') }}
      
      - name: Kutuphaneleri yukle
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy python-telegram-bot requests
          pip install --upgrade git+https://github.com/rongardF/tvdatafeed.git
      
      - name: Mesajlari kontrol et ve cevapla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python -c "from telegram_bot.analysis_handler import run_message_check; run_message_check()"
      
      - name: Last update ID'yi repoya kaydet
        if: always()
        run: |
          if [ -f "last_update_id.txt" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git add last_update_id.txt
            
            if git diff --staged --quiet; then
              echo "Update ID degismedi"
            else
              git commit -m "Update last_update_id"
              
              for i in 1 2 3; do
                if git pull --rebase origin main 2>/dev/null; then
                  if git push origin main; then
                    echo "Update ID kaydedildi"
                    break
                  fi
                fi
                echo "Push denemesi $i basarisiz"
                sleep 3
              done
            fi
          fi
      
      - name: Tamamlandi
        run: echo "Mesaj kontrol tamamlandi"
