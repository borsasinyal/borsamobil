name: Borsa Sinyal Bot

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Hangi görev?'
        required: true
        default: 'full_scan_with_tracking'
        type: choice
        options:
          - morning_preparation
          - premarket_report
          - market_open_scan
          - full_scan_2h
          - full_scan
          - quick_scan
          - hourly_scan
          - 4h_scan
          - 4h_scan_evening
          - end_of_day_report
          - weekly_report
          - signal_tracker
          - full_scan_with_tracking

# 🔑 DB commit için repo yazma izni (KESİNLİKLE GEREKLİ)
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # 🔑 Repo indir (DB dahil - checkout ile gelir)
      - name: Repo indir (DB dahil)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      
      - name: Kutuphaneleri yukle
        run: |
          pip install --upgrade pip
          pip install flask yfinance pandas numpy python-telegram-bot apscheduler requests
          pip install --upgrade git+https://github.com/rongardF/tvdatafeed.git
      
      - name: DB durumu kontrol
        run: |
          if [ -f "borsa_sinyal.db" ]; then
            echo "✅ DB repo'dan geldi"
            ls -lh borsa_sinyal.db
            echo "📊 Boyut: $(du -h borsa_sinyal.db | cut -f1)"
          else
            echo "⚠️ DB yok, yeni oluşturulacak"
          fi
      
      - name: Veritabani baslat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python database.py
      
      - name: Veri cek ve Gorev calistir (BIRLESIK)
        if: ${{ github.event.inputs.job_type != 'signal_tracker' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python << 'EOF'
          import sys
          from config import BIST_SYMBOLS
          
          job_type = "${{ github.event.inputs.job_type }}"
          
          # 4H TARAMALARI - Veri çekme GEREKMEZ (TV'den direkt çeker)
          if job_type == "4h_scan":
              print("=" * 60)
              print("🕐 1. 4 SAATLİK TARAMA (14:00 - TV'den direkt)")
              print("=" * 60)
              from services.scheduler import job_4h_scan
              job_4h_scan()
          
          elif job_type == "4h_scan_evening":
              print("=" * 60)
              print("🕐 2. 4 SAATLİK TARAMA (18:15 - YARIN İÇİN)")
              print("=" * 60)
              from services.scheduler import job_4h_scan_evening
              job_4h_scan_evening()
          
          elif job_type == "hourly_scan":
              print("=" * 60)
              print("⚡ SAATLİK TARAMA (MANUEL - Tavan Adayı)")
              print("=" * 60)
              from services.scheduler import job_hourly_scan
              job_hourly_scan()
          
          # HAFTALIK RAPOR - Veri çekme gerekmez
          elif job_type == "weekly_report":
              print("=" * 60)
              print("📊 HAFTALIK RAPOR")
              print("=" * 60)
              from services.scheduler import job_weekly_report
              job_weekly_report()
          
          # GÜN SONU RAPORU - Yahoo'dan çeker, veri gerekmez
          elif job_type == "end_of_day_report":
              print("=" * 60)
              print("🌆 GÜN SONU RAPORU (5 MESAJ)")
              print("=" * 60)
              from services.scheduler import job_end_of_day_report
              job_end_of_day_report()
          
          else:
              # DİĞER GÖREVLER - Önce veri çek
              print("=" * 60)
              print("📥 1. AŞAMA: VERİ ÇEKİLİYOR")
              print("=" * 60)
              from services.data_fetcher import fetch_all_daily
              fetch_all_daily(symbols_list=BIST_SYMBOLS, delay=0.05)
              
              print("=" * 60)
              print("🎯 2. AŞAMA: GÖREV ÇALIŞTIRILIYOR")
              print("=" * 60)
              
              if job_type == "morning_preparation":
                  from services.scheduler import job_morning_preparation
                  job_morning_preparation()
              elif job_type == "premarket_report":
                  from services.scheduler import job_premarket_report
                  job_premarket_report()
              elif job_type == "market_open_scan":
                  from services.scheduler import job_market_open_scan
                  job_market_open_scan()
              elif job_type == "full_scan_2h":
                  from services.scheduler import job_full_scan_2h
                  job_full_scan_2h()
              elif job_type == "full_scan":
                  from services.scheduler import job_full_scan
                  job_full_scan()
              elif job_type == "quick_scan":
                  from services.scheduler import job_quick_scan
                  job_quick_scan()
              elif job_type == "full_scan_with_tracking":
                  from services.scheduler import job_full_scan_with_tracking
                  job_full_scan_with_tracking()
          
          print("=" * 60)
          print("✅ TÜM AŞAMALAR TAMAMLANDI")
          print("=" * 60)
          EOF
      
      - name: Sinyal takip gorevi
        if: ${{ github.event.inputs.job_type == 'signal_tracker' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python -c "from services.signal_tracker import track_signals_job; track_signals_job()"
      
      # 🔑🔑🔑 DB KALICILIĞI - REPO'YA COMMIT (KESİNLİKLE ÇALIŞMALI)
      - name: DB'yi repoya kaydet (KALICI)
        if: always()
        run: |
          if [ -f "borsa_sinyal.db" ]; then
            echo "📊 DB boyutu: $(du -h borsa_sinyal.db | cut -f1)"
            echo "📋 DB detay:"
            ls -lh borsa_sinyal.db
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git add borsa_sinyal.db
            
            # Değişiklik var mı kontrol et
            if git diff --staged --quiet; then
              echo "ℹ️ DB'de değişiklik yok, commit atılmadı"
            else
              git commit -m "🤖 DB güncelleme: ${{ github.event.inputs.job_type }} - $(date '+%Y-%m-%d %H:%M')"
              
              # Push - conflict olursa 3 kez dene
              PUSH_SUCCESS=false
              for i in 1 2 3; do
                echo "🔄 Push denemesi $i/3..."
                if git pull --rebase origin main 2>/dev/null; then
                  if git push origin main; then
                    echo "✅ DB repo'ya kaydedildi (deneme $i)"
                    PUSH_SUCCESS=true
                    break
                  fi
                fi
                echo "⚠️ Push başarısız, tekrar deneniyor..."
                sleep 5
              done
              
              if [ "$PUSH_SUCCESS" = false ]; then
                echo "❌❌❌ DB PUSH BAŞARISIZ! Sonraki taramada tekrar denenecek"
                exit 0
              fi
            fi
          else
            echo "⚠️ DB dosyası yok, commit atlanıyor"
          fi
      
      - name: Tamamlandi
        run: echo "✅ Gorev tamamlandi"
